version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    ports:
      - '4000:4000'
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - PORT=4000
      - MONGODB_URI=mongodb://mongo:27017/edmira_auth
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # You should override these secrets in a real .env file or CI/CD
      - JWT_SECRET=super_secret_key_change_this
      - JWT_EXPIRES_IN=1h
      - JWT_REFRESH_SECRET=super_secret_refresh_key_change_this
      - JWT_REFRESH_EXPIRES_IN=7d
      # Add other required SSO vars here or use env_file
    command: yarn start:dev
    depends_on:
      - mongo
      - redis
    networks:
      - app-network
    restart: always

  mongo:
    image: mongo:latest
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    networks:
      - app-network
    restart: always

  redis:
    image: redis:alpine
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    networks:
      - app-network
    restart: always

networks:
  app-network:
    driver: bridge

volumes:
  mongo-data:
  redis-data:
